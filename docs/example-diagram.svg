<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="900" viewBox="0 0 1060 900" role="img" aria-labelledby="title">
    <title id="title">DomWires counter example: a mediator dispatches a message, the context maps it to a
        command, the command mutates the model and the mediator renders the result</title>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
        </marker>
    </defs>
    <style>
        .t { font-family: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
        .title { font-size: 16px; font-weight: 600; }
        .sub { font-size: 12.5px; fill: #475569; }
        .line { font-size: 13px; }
        .small { font-size: 11.5px; fill: #64748b; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
        .ctx { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
        .cmd { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
        .ui { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
        .fac { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
        .arrow { fill: none; stroke: #111827; stroke-width: 1.6; marker-end: url(#arrow); }
        .num { fill: #111827; }
        .numtext { font-size: 11.5px; font-weight: 600; fill: #ffffff; }
    </style>

    <rect width="1060" height="900" fill="#ffffff"/>

    <!-- factory with the bindings of the example -->
    <rect class="fac" x="40" y="100" width="240" height="170" rx="10"/>
    <text class="t title" x="60" y="128">Factory</text>
    <text class="t small" x="60" y="146">bindings of the example</text>
    <text class="t sub" x="60" y="176">IFactory → factory</text>
    <text class="t sub" x="60" y="200">ICounterModel → model</text>
    <text class="t sub" x="60" y="224">ICounterModelImmutable → model</text>
    <text class="t sub" x="60" y="248">mountPoint → #app</text>

    <!-- context -->
    <rect class="ctx" x="330" y="40" width="430" height="470" rx="18"/>
    <text class="t title" x="352" y="74" fill="#1d4ed8">CounterContext</text>
    <text class="t small" x="500" y="74">composition root</text>

    <rect class="box" x="360" y="110" width="370" height="92" rx="10"/>
    <text class="t title" x="380" y="140">CounterModel</text>
    <text class="t sub" x="380" y="162">ICounterModel · ICounterModelImmutable</text>
    <text class="t sub" x="380" y="184">value 0…10, dispatches COUNTER_CHANGED</text>

    <rect class="box" x="360" y="258" width="370" height="92" rx="10"/>
    <text class="t title" x="380" y="288">CounterMediator</text>
    <text class="t sub" x="380" y="310">sees only ICounterModelImmutable</text>
    <text class="t sub" x="380" y="332">renders the DOM, dispatches user intentions</text>

    <rect class="box" x="360" y="406" width="370" height="86" rx="10"/>
    <text class="t title" x="380" y="434">CommandMapper</text>
    <text class="t sub" x="380" y="456">CHANGE_COUNTER → ChangeCounterCommand</text>
    <text class="t sub" x="380" y="478">+ CounterIsNotAtMaxGuards</text>

    <!-- command, instantiated by the factory -->
    <rect class="cmd" x="360" y="560" width="370" height="84" rx="10"/>
    <text class="t title" x="380" y="590" fill="#6d28d9">ChangeCounterCommand</text>
    <text class="t sub" x="380" y="612">execute(): model.setValue(value + delta)</text>
    <text class="t small" x="380" y="632">model and delta are injected, the instance is pooled</text>

    <!-- rendered ui -->
    <rect class="ui" x="812" y="258" width="210" height="92" rx="10"/>
    <text class="t small" x="832" y="282">#app</text>
    <rect x="832" y="296" width="54" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text class="t sub" x="859" y="315" text-anchor="middle">+1</text>
    <rect x="896" y="296" width="66" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text class="t sub" x="929" y="315" text-anchor="middle">reset</text>
    <text class="t title" x="986" y="315" fill="#15803d">3</text>

    <!-- 1: ui -> mediator, 7: mediator -> ui -->
    <path class="arrow" d="M 812 296 L 734 296"/>
    <path class="arrow" d="M 734 316 L 812 316"/>
    <circle class="num" cx="773" cy="278" r="11"/>
    <text class="t numtext" x="773" y="282" text-anchor="middle">1</text>
    <circle class="num" cx="773" cy="336" r="11"/>
    <text class="t numtext" x="773" y="340" text-anchor="middle">7</text>

    <!-- 2: mediator -> context mapping, 6: context -> mediator -->
    <path class="arrow" d="M 700 350 L 700 404"/>
    <path class="arrow" d="M 390 406 L 390 352"/>
    <circle class="num" cx="716" cy="378" r="11"/>
    <text class="t numtext" x="716" y="382" text-anchor="middle">2</text>
    <circle class="num" cx="374" cy="378" r="11"/>
    <text class="t numtext" x="374" y="382" text-anchor="middle">6</text>

    <!-- 3: mapper -> command -->
    <path class="arrow" d="M 545 492 L 545 558"/>
    <circle class="num" cx="563" cy="526" r="11"/>
    <text class="t numtext" x="563" y="530" text-anchor="middle">3</text>

    <!-- 4: command -> model -->
    <path class="arrow" d="M 358 602 L 300 602 L 300 156 L 358 156"/>
    <circle class="num" cx="300" cy="380" r="11"/>
    <text class="t numtext" x="300" y="384" text-anchor="middle">4</text>

    <!-- 5: model bubbles up to the context -->
    <path class="arrow" d="M 732 156 L 786 156 L 786 76 L 762 76"/>
    <circle class="num" cx="800" cy="120" r="11"/>
    <text class="t numtext" x="800" y="124" text-anchor="middle">5</text>

    <!-- legend -->
    <text class="t title" x="40" y="712">How the example works</text>

    <circle class="num" cx="52" cy="742" r="10"/>
    <text class="t numtext" x="52" y="746" text-anchor="middle">1</text>
    <text class="t line" x="74" y="746">click on "+1": the mediator dispatches CHANGE_COUNTER {delta: 1}</text>

    <circle class="num" cx="52" cy="774" r="10"/>
    <text class="t numtext" x="52" y="778" text-anchor="middle">2</text>
    <text class="t line" x="74" y="778">the message bubbles up to CounterContext</text>

    <circle class="num" cx="52" cy="806" r="10"/>
    <text class="t numtext" x="52" y="810" text-anchor="middle">3</text>
    <text class="t line" x="74" y="810">the context maps it to ChangeCounterCommand, the guard allows</text>

    <circle class="num" cx="52" cy="838" r="10"/>
    <text class="t numtext" x="52" y="842" text-anchor="middle">4</text>
    <text class="t line" x="74" y="842">the command is created with injected model and delta and changes the state</text>

    <circle class="num" cx="572" cy="742" r="10"/>
    <text class="t numtext" x="572" y="746" text-anchor="middle">5</text>
    <text class="t line" x="594" y="746">the model dispatches COUNTER_CHANGED {value}</text>

    <circle class="num" cx="572" cy="774" r="10"/>
    <text class="t numtext" x="572" y="778" text-anchor="middle">6</text>
    <text class="t line" x="594" y="778">the context forwards the message to mediators</text>

    <circle class="num" cx="572" cy="806" r="10"/>
    <text class="t numtext" x="572" y="810" text-anchor="middle">7</text>
    <text class="t line" x="594" y="810">the mediator renders the new value of the immutable model</text>
</svg>
