<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">DomWires Fire message flow</title><desc id="desc">GameContext owns GameMediator, which creates and owns GameView. GameView reports a click to the mediator. The mediator dispatches FIRE into SceneContext. Fire changes SceneModel. STATE_CHANGED reaches SceneMediator, which reads the live Immutable model and updates its owned SceneView.</desc>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y="0.5" width="1199" height="819" rx="20" fill="#101a24" stroke="#405565"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65d6c4"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b6a4ff"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b0c1d0"/></marker></defs><text x="40" y="48" font-size="14" font-weight="700" fill="#65d6c4" letter-spacing="2">ONE MESSAGE. A COMPLETE ROUND TRIP.</text><text x="40" y="87" font-size="32" font-weight="650" fill="#edf5fa" >Fire, update, render</text><rect x="24" y="113" width="1152" height="634" rx="18" fill="#192735" stroke="#405565"/><text x="45" y="143" font-size="17" font-weight="600" fill="#b0c1d0" >GameContext</text><rect x="297" y="322" width="859" height="397" rx="16" fill="#182f36" stroke="#405565"/><text x="317" y="352" font-size="17" font-weight="650" fill="#65d6c4" >SceneContext</text><rect x="48" y="177" width="186" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="66" y="209" font-size="21" font-weight="600" fill="#edf5fa" >GameView</text><text x="66" y="236" font-size="16" font-weight="400" fill="#b0c1d0" >DOM click</text><rect x="322" y="177" width="262" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="340" y="209" font-size="21" font-weight="600" fill="#edf5fa" >GameMediator</text><text x="340" y="236" font-size="16" font-weight="400" fill="#b0c1d0" >dispatchMessage(FIRE)</text><rect x="787" y="177" width="339" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="805" y="209" font-size="21" font-weight="600" fill="#edf5fa" >Message routing</text><text x="805" y="236" font-size="16" font-weight="400" fill="#b0c1d0" >Explicit child receive predicate</text><path d="M234 218 H310" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="240" y="201" font-size="14" font-weight="650" fill="#65d6c4" >callback</text><path d="M584 218 H775" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="621" y="201" font-size="14" font-weight="650" fill="#65d6c4" >FIRE · bubbles</text><text x="48" y="286" font-size="16" font-weight="400" fill="#b0c1d0" >GameMediator creates and owns GameView</text><path d="M950 259 V297 H511 V372" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="609" y="286" font-size="14" font-weight="400" fill="#65d6c4" >receive FIRE</text><rect x="322" y="384" width="210" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="340" y="416" font-size="21" font-weight="600" fill="#edf5fa" >Message mapping</text><text x="340" y="443" font-size="16" font-weight="400" fill="#b0c1d0" >map(FIRE, Fire)</text><rect x="622" y="384" width="184" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="640" y="416" font-size="21" font-weight="600" fill="#b6a4ff" >Fire</text><text x="640" y="443" font-size="16" font-weight="400" fill="#b0c1d0" >Command</text><rect x="896" y="384" width="228" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="914" y="416" font-size="21" font-weight="600" fill="#edf5fa" >SceneModel</text><text x="914" y="443" font-size="16" font-weight="400" fill="#b0c1d0" >Owns scene state</text><path d="M532 425 H610" fill="none" stroke="#b6a4ff" stroke-width="2.5"  marker-end="url(#a1)"/><text x="551" y="408" font-size="14" font-weight="400" fill="#b6a4ff" >run</text><path d="M806 425 H884" fill="none" stroke="#b6a4ff" stroke-width="2.5"  marker-end="url(#a1)"/><text x="823" y="408" font-size="14" font-weight="400" fill="#b6a4ff" >fire()</text><rect x="322" y="593" width="210" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="340" y="625" font-size="21" font-weight="600" fill="#edf5fa" >SceneView</text><text x="340" y="652" font-size="16" font-weight="400" fill="#b0c1d0" >Canvas rendering</text><rect x="622" y="593" width="234" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="640" y="625" font-size="21" font-weight="600" fill="#edf5fa" >SceneMediator</text><text x="640" y="652" font-size="16" font-weight="400" fill="#b0c1d0" >Reads Immutable state</text><path d="M1006 466 V556 H739 V581" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="687" y="531" font-size="15" font-weight="600" fill="#65d6c4" >STATE_CHANGED · context forwards</text><path d="M622 634 H544" fill="none" stroke="#b6a4ff" stroke-width="2.5"  marker-end="url(#a1)"/><text x="536" y="617" font-size="14" font-weight="400" fill="#b6a4ff" >render(data)</text><path d="M856 634 H1104 V478" fill="none" stroke="#b0c1d0" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a2)"/><text x="876" y="617" font-size="16" font-weight="400" fill="#b0c1d0" >read access</text><text x="322" y="700" font-size="16" font-weight="400" fill="#b0c1d0" >SceneMediator creates and owns SceneView. Views render data and report input.</text><text x="40" y="793" font-size="16" font-weight="400" fill="#b0c1d0" >Solid: callbacks / messages / execution  ·  Dashed: read access  ·  Based on examples/game</text></g></svg>
