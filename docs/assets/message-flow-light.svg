<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DomWires Fire message flow</title><desc id="desc">A Fire button dispatches FIRE through GameContext into SceneContext. Fire changes SceneModel. STATE_CHANGED is forwarded through SceneContext to SceneView, which reads the live Immutable model.</desc>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y="0.5" width="1199" height="719" rx="20" fill="#f7fafb" stroke="#cfdae2"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e80"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6550bc"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526475"/></marker></defs><text x="40" y="48" font-size="14" font-weight="700" fill="#087e80" letter-spacing="2">ONE MESSAGE. A COMPLETE ROUND TRIP.</text><text x="40" y="87" font-size="32" font-weight="650" fill="#182635" >Fire, update, render</text><rect x="24" y="113" width="1152" height="550" rx="18" fill="#ffffff" stroke="#cfdae2"/><text x="45" y="140" font-size="16" font-weight="600" fill="#526475" >GameContext</text><rect x="277" y="279" width="874" height="362" rx="16" fill="#edf5f5" stroke="#cfdae2"/><text x="298" y="308" font-size="17" font-weight="650" fill="#087e80" >SceneContext</text><rect x="48" y="167" width="182" height="82" rx="14" fill="#ffffff" stroke="#cfdae2"/><text x="66" y="199" font-size="21" font-weight="600" fill="#182635" >Fire button</text><text x="66" y="226" font-size="16" font-weight="400" fill="#526475" >Browser input</text><rect x="322" y="167" width="248" height="82" rx="14" fill="#ffffff" stroke="#cfdae2"/><text x="340" y="199" font-size="21" font-weight="600" fill="#182635" >GameContext</text><text x="340" y="226" font-size="16" font-weight="400" fill="#526475" >dispatchMessage(FIRE)</text><rect x="322" y="351" width="210" height="82" rx="14" fill="#ffffff" stroke="#cfdae2"/><text x="340" y="383" font-size="21" font-weight="600" fill="#182635" >Message mapping</text><text x="340" y="410" font-size="16" font-weight="400" fill="#526475" >map(FIRE, Fire)</text><rect x="622" y="351" width="184" height="82" rx="14" fill="#ffffff" stroke="#cfdae2"/><text x="640" y="383" font-size="21" font-weight="600" fill="#6550bc" >Fire</text><text x="640" y="410" font-size="16" font-weight="400" fill="#526475" >Command</text><rect x="896" y="351" width="228" height="82" rx="14" fill="#ffffff" stroke="#cfdae2"/><text x="914" y="383" font-size="21" font-weight="600" fill="#182635" >SceneModel</text><text x="914" y="410" font-size="16" font-weight="400" fill="#526475" >Owns scene state</text><rect x="322" y="518" width="240" height="82" rx="14" fill="#ffffff" stroke="#cfdae2"/><text x="340" y="550" font-size="21" font-weight="600" fill="#182635" >SceneView</text><text x="340" y="577" font-size="16" font-weight="400" fill="#526475" >Mediator · render()</text><path d="M230 208 H310" fill="none" stroke="#087e80" stroke-width="2.5"  marker-end="url(#a0)"/><text x="246" y="191" font-size="14" font-weight="650" fill="#087e80" >FIRE</text><path d="M427 249 V339" fill="none" stroke="#087e80" stroke-width="2.5"  marker-end="url(#a0)"/><text x="443" y="270" font-size="14" font-weight="400" fill="#087e80" >receive predicate</text><path d="M532 392 H610" fill="none" stroke="#6550bc" stroke-width="2.5"  marker-end="url(#a1)"/><text x="551" y="375" font-size="14" font-weight="400" fill="#6550bc" >run</text><path d="M806 392 H884" fill="none" stroke="#6550bc" stroke-width="2.5"  marker-end="url(#a1)"/><text x="823" y="375" font-size="14" font-weight="400" fill="#6550bc" >fire()</text><path d="M1006 433 V485 H442 V506" fill="none" stroke="#087e80" stroke-width="2.5"  marker-end="url(#a0)"/><text x="687" y="469" font-size="15" font-weight="600" fill="#087e80" >STATE_CHANGED · context forwards</text><path d="M562 559 H1089 V445" fill="none" stroke="#526475" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a2)"/><text x="645" y="546" font-size="16" font-weight="400" fill="#526475" >reads SceneModelImmutable</text><text x="322" y="624" font-size="16" font-weight="400" fill="#526475" >One live model. Commands can change it; the view receives its read contract.</text><text x="40" y="699" font-size="16" font-weight="400" fill="#526475" >Solid: messages / execution  ·  Dashed: read access  ·  Based on examples/game</text></g></svg>
