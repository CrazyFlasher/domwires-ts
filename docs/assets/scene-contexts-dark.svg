<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Scene lab context architecture</title><desc id="desc">GameContext owns the clock, replaceable SceneContext and persistent HudContext. Scene input and level-loaded notifications cross only explicit routes. Closing a scene cancels loads and releases its owned resources.</desc>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y="0.5" width="1199" height="789" rx="20" fill="#101a24" stroke="#405565"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#65d6c4"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b6a4ff"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b0c1d0"/></marker></defs><text x="40" y="49" font-size="14" font-weight="700" fill="#65d6c4" letter-spacing="2">SCENE LAB / CONTEXT BOUNDARIES</text><text x="40" y="89" font-size="32" font-weight="650" fill="#edf5fa" >Share messages. Own lifetimes.</text><rect x="24" y="115" width="1152" height="640" rx="18" fill="#192735" stroke="#405565"/><text x="45" y="148" font-size="22" font-weight="650" fill="#edf5fa" >GameContext</text><text x="45" y="177" font-size="17" font-weight="400" fill="#b0c1d0" >Owns the tick clock and the serial SwitchScene command</text><rect x="48" y="239" width="660" height="411" rx="14" fill="#182f36" stroke="#405565"/><text x="68" y="272" font-size="23" font-weight="650" fill="#65d6c4" >SceneContext</text><rect x="815" y="239" width="335" height="411" rx="14" fill="#182f36" stroke="#405565"/><text x="835" y="272" font-size="23" font-weight="650" fill="#65d6c4" >HudContext</text><path d="M263 185 V226" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="282" y="215" font-size="16" font-weight="600" fill="#65d6c4" >TICK · FIRE · LOAD</text><rect x="73" y="311" width="272" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="91" y="343" font-size="21" font-weight="600" fill="#b6a4ff" >Tick · Fire · Load</text><text x="91" y="370" font-size="16" font-weight="400" fill="#b0c1d0" >Load uses latest</text><rect x="405" y="311" width="276" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="423" y="343" font-size="21" font-weight="600" fill="#edf5fa" >TimerLevelLoader</text><text x="423" y="370" font-size="16" font-weight="400" fill="#b0c1d0" >Owned adapter</text><path d="M345 353 H393" fill="none" stroke="#b6a4ff" stroke-width="2.5"  marker-end="url(#a1)"/><text x="350" y="335" font-size="13" font-weight="400" fill="#b6a4ff" >Load</text><rect x="73" y="441" width="272" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="91" y="473" font-size="21" font-weight="600" fill="#edf5fa" >SceneModel</text><text x="91" y="500" font-size="16" font-weight="400" fill="#b0c1d0" >Pool of reusable bullets</text><path d="M209 393 V429" fill="none" stroke="#b6a4ff" stroke-width="2.5"  marker-end="url(#a1)"/><text x="225" y="420" font-size="15" font-weight="400" fill="#b6a4ff" >updates state</text><rect x="405" y="545" width="276" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="423" y="577" font-size="21" font-weight="600" fill="#edf5fa" >SceneView</text><text x="423" y="604" font-size="16" font-weight="400" fill="#b0c1d0" >Immutable scene state</text><path d="M209 523 V586 H393" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="76" y="572" font-size="14" font-weight="400" fill="#65d6c4" >STATE_CHANGED</text><rect x="840" y="311" width="286" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="858" y="343" font-size="21" font-weight="600" fill="#b6a4ff" >UpdateHud</text><text x="858" y="370" font-size="16" font-weight="400" fill="#b0c1d0" >Command</text><rect x="840" y="441" width="286" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="858" y="473" font-size="21" font-weight="600" fill="#edf5fa" >HudModel</text><text x="858" y="500" font-size="16" font-weight="400" fill="#b0c1d0" >Loaded level / scene</text><rect x="840" y="545" width="286" height="82" rx="14" fill="#192735" stroke="#405565"/><text x="858" y="577" font-size="21" font-weight="600" fill="#edf5fa" >HudView</text><text x="858" y="604" font-size="16" font-weight="400" fill="#b0c1d0" >Immutable HUD state</text><path d="M983 393 V429" fill="none" stroke="#b6a4ff" stroke-width="2.5"  marker-end="url(#a1)"/><path d="M983 523 V533" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><path d="M345 482 H755 V211 H983 V299" fill="none" stroke="#65d6c4" stroke-width="2.5"  marker-end="url(#a0)"/><text x="528" y="203" font-size="16" font-weight="600" fill="#65d6c4" >LEVEL_LOADED · bubble to root, then receive in HUD</text><text x="49" y="692" font-size="20" font-weight="650" fill="#edf5fa" >Switch scene</text><text x="240" y="692" font-size="18" font-weight="600" fill="#b6a4ff" >await oldScene.close()</text><text x="545" y="692" font-size="22" font-weight="400" fill="#b0c1d0" >→</text><text x="586" y="692" font-size="18" font-weight="600" fill="#65d6c4" >create the next SceneContext</text><text x="49" y="725" font-size="17" font-weight="400" fill="#b0c1d0" >Closing aborts loading and releases the scene adapter, pool and view. The root clock and HUD survive.</text></g></svg>
