name: Test

on: [push]

jobs:
  build:
    strategy:
      matrix:
        node: [20.x, 22.x, 24.x]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run eslint-run
      - run: npm run build
